services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: sparsh
      MYSQL_USER: sparsh
      MYSQL_PASSWORD: sparsh
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sparsh
      MINIO_ROOT_PASSWORD: sparsh-local-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:prod"
volumes:
  mysql_data:
  minio_data:
